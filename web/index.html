<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Interactive macroeconomics: 25 lectures, live simulation tools, crisis case studies, and a real-data explorer."
    />
    <title>MacroEconomics — Interactive Course</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('macro-theme')
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark')
            // Keep the browser chrome in step before first paint; the runtime
            // theme module takes over from here.
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#090c11')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
