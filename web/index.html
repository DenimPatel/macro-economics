<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="Interactive macroeconomics: 25 lectures, live simulation tools, crisis case studies, and a real-data explorer."
    />
    <title>MacroEconomics — Interactive Course</title>
    <script>
      /*
       * No-flash boot. This runs before any module loads, so it has to
       * duplicate two things from `src/lib/preferences.ts`: how a stored
       * preference set is read, and how a preference maps to a CSS value.
       * `src/tests/preferences.test.ts` fails if this script and that module
       * ever disagree about a storage key, an attribute name, or a mapping.
       *
       * The old version of this script only knew `macro-theme`. Theme is now
       * one field of the versioned `macro-prefs` envelope, with the legacy
       * key adopted once for visitors who set it before this existed.
       */
      ;(function () {
        try {
          var PREF_KEY = 'macro-prefs'
          var LEGACY_THEME_KEY = 'macro-theme'
          var PREF_VERSION = 1
          var SCALES = [0.9, 1, 1.15, 1.3]
          var MEASURE = { narrow: '62ch', normal: '70ch', wide: '82ch' }
          var LINE_HEIGHT = { tight: '1.4', normal: '1.6', relaxed: '1.8' }
          var SPACE = { compact: '0.85', comfortable: '1', spacious: '1.15' }

          var prefs = {
            theme: 'system',
            textScale: 1,
            measure: 'normal',
            lineHeight: 'normal',
            density: 'comfortable',
            motion: 'system',
            chartGrid: true,
            focusMode: false,
          }

          // The legacy key is read only when the envelope is entirely absent,
          // so an explicit `theme` in `macro-prefs` is never overridden by a
          // stale value. A corrupt envelope is not replaced by it either:
          // corrupt means forget, and forgetting is honest.
          var raw = null
          try {
            raw = window.localStorage.getItem(PREF_KEY)
          } catch (e) {
            raw = null
          }
          if (raw === null) {
            var legacy = null
            try {
              legacy = window.localStorage.getItem(LEGACY_THEME_KEY)
            } catch (e) {
              legacy = null
            }
            if (legacy === 'dark' || legacy === 'light') prefs.theme = legacy
          } else {
            var parsed = null
            try {
              parsed = JSON.parse(raw)
            } catch (e) {
              parsed = null
            }
            // A payload from a newer build, or not an object: fall back to
            // defaults rather than guessing at a shape we cannot read.
            if (
              parsed &&
              typeof parsed === 'object' &&
              (typeof parsed.v !== 'number' || parsed.v <= PREF_VERSION)
            ) {
              var source = 'prefs' in parsed ? parsed.prefs : parsed
              if (source && typeof source === 'object') {
                for (var key in prefs) {
                  if (Object.prototype.hasOwnProperty.call(source, key)) {
                    var value = source[key]
                    var ok = typeof value === typeof prefs[key]
                    if (key === 'textScale') ok = SCALES.indexOf(value) !== -1
                    else if (key === 'theme') ok = value === 'light' || value === 'dark' || value === 'system'
                    else if (key === 'measure') ok = value in MEASURE
                    else if (key === 'lineHeight') ok = value in LINE_HEIGHT
                    else if (key === 'density') ok = value in SPACE
                    else if (key === 'motion') ok = value === 'system' || value === 'reduced' || value === 'full'
                    if (ok) prefs[key] = value
                  }
                }
              }
            }
          }

          var root = document.documentElement
          root.setAttribute('data-pref-theme', prefs.theme)
          root.setAttribute('data-pref-density', prefs.density)
          root.setAttribute('data-pref-motion', prefs.motion)
          root.setAttribute('data-pref-measure', prefs.measure)
          root.setAttribute('data-pref-line-height', prefs.lineHeight)
          root.setAttribute('data-pref-focus', prefs.focusMode ? 'on' : 'off')
          root.style.setProperty('--pref-text-scale', String(prefs.textScale))
          root.style.setProperty('--pref-measure', MEASURE[prefs.measure])
          root.style.setProperty('--pref-line-height', LINE_HEIGHT[prefs.lineHeight])
          root.style.setProperty('--pref-space', SPACE[prefs.density])

          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = prefs.theme === 'dark' || (prefs.theme === 'system' && prefersDark)
          if (dark) root.classList.add('dark')
          root.style.colorScheme = dark ? 'dark' : 'light'
          // Keep the browser chrome in step before first paint; the runtime
          // preference module takes over from here.
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#090c11' : '#f7f8fa')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
